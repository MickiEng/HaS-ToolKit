<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaS Toolkit</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --sidebar-width: 220px;
            --primary: #005A9C;
            --primary-dark: #004478;
            --primary-light: #1a7ac4;
            --accent: #008080;
            --bg-light: #f4f7f9;
            --border: #cce0f0;
            --text-dark: #1a2b3c;
            --text-mid: #4a6070;
            --text-light: #ffffff;
            --placeholder-bg: #dce6ee;
            --placeholder-text: #8a9fae;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
        }

        /* ── Layout ── */
        .app-shell {
            display: flex;
            height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 20px 16px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .sidebar-header .app-title {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
            margin-bottom: 4px;
        }

        .sidebar-header .app-subtitle {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
        }

        .sidebar-nav {
            padding: 12px 0;
            flex: 1;
        }

        .nav-section-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            padding: 10px 16px 6px;
        }

        /* ── Tool Buttons ── */
        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-left: 3px solid transparent;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, border-color 0.15s;
            gap: 2px;
        }

        .tool-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.1);
            border-left-color: rgba(255,255,255,0.4);
        }

        .tool-btn.active {
            background: rgba(255,255,255,0.15);
            border-left-color: #ffffff;
        }

        .tool-btn:disabled {
            cursor: not-allowed;
        }

        .btn-step {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
        }

        .tool-btn.active .btn-step,
        .tool-btn:hover:not(:disabled) .btn-step {
            color: rgba(255,255,255,0.65);
        }

        .btn-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            line-height: 1.2;
        }

        .tool-btn:disabled .btn-name {
            color: var(--placeholder-text);
        }

        .btn-desc {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.3;
        }

        .tool-btn:disabled .btn-desc {
            color: var(--placeholder-text);
        }

        .btn-badge {
            display: inline-block;
            margin-top: 3px;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.4);
        }

        .sidebar-footer {
            padding: 14px 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.68rem;
            color: rgba(255,255,255,0.3);
            line-height: 1.4;
        }

        /* ── Main Content ── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── Welcome Screen ── */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            padding: 40px;
            text-align: center;
            background: var(--bg-light);
        }

        .welcome-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .welcome-icon svg {
            width: 34px;
            height: 34px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .welcome-subtitle {
            font-size: 0.95rem;
            color: var(--text-mid);
            max-width: 360px;
            line-height: 1.6;
        }

        .welcome-hint {
            font-size: 0.8rem;
            color: var(--placeholder-text);
            margin-top: 8px;
        }

        /* ── Tool Frame ── */
        .tool-frame {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .tool-frame.visible {
            display: block;
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">

        <div class="sidebar-header">
            <div class="app-title">Beal University</div>
            <div class="app-subtitle">Hub &amp Spoke<br>Workflow Tools</div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-label">Workflow Steps</div>

            <!-- Step 1 — active tool -->
            <button class="tool-btn active" onclick="loadTool('syllabusbuilder.html', this)">
                <span class="btn-step">Step 1</span>
                <span class="btn-name">Syllabus Builder</span>
                <span class="btn-desc">Export course syllabus &amp; weekly lesson templates.</span>
            </button>

            <!-- Placeholders for future steps -->
            <button class="tool-btn" disabled>
                <span class="btn-step">Step 2</span>
                <span class="btn-name">Coming Soon</span>
                <span class="btn-desc">Description will appear here</span>
                <span class="btn-badge">Planned</span>
            </button>

            <button class="tool-btn" disabled>
                <span class="btn-step">Step 3</span>
                <span class="btn-name">Coming Soon</span>
                <span class="btn-desc">Description will appear here</span>
                <span class="btn-badge">Planned</span>
            </button>

            <button class="tool-btn" disabled>
                <span class="btn-step">Step 4</span>
                <span class="btn-name">Coming Soon</span>
                <span class="btn-desc">Description will appear here</span>
                <span class="btn-badge">Planned</span>
            </button>

        </nav>


    </aside>

    <!-- ── Main Content ── -->
    <main class="main-content">

        <!-- Welcome screen (hidden by default) -->
        <div class="welcome-screen" id="welcome" style="display:none">
            <div class="welcome-icon">
                <svg viewBox="0 0 24 24">
                    <!-- simple document + checkmark icon -->
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="9" y1="13" x2="15" y2="13"/>
                    <line x1="9" y1="17" x2="13" y2="17"/>
                </svg>
            </div>
            <div class="welcome-title">Nursing Curriculum Toolkit</div>
            <div class="welcome-subtitle">
                A collection of workflow tools to support syllabus development
                and course design for nursing programs.
            </div>
            <div class="welcome-hint">Select a step from the sidebar to get started.</div>
        </div>

        <!-- Tool loaded here via iframe -->
        <iframe
            id="tool-frame"
            class="tool-frame visible"
            src="syllabusbuilder.html"
            title="Workflow Tool"
            allowfullscreen
        ></iframe>

    </main>

</div>

<script>
    function loadTool(src, btn) {
        const frame = document.getElementById('tool-frame');
        const welcome = document.getElementById('welcome');

        // Update active state
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Load the tool
        frame.src = src;
        frame.classList.add('visible');
        welcome.style.display = 'none';
    }
</script>

</body>
</html>
